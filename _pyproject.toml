[project]
name = "fastapi-core"
version = "0.1.0"
description = "DocMesh FastAPI 기반 마이크로서비스 공통 SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "minio>=7.2.20",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.0",
    "pyjwt[crypto]>=2.12.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.pytest.ini_options]
testpaths = ["test_fastapi_core"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = ["integration: mark test as integration test (requires external services)"]
addopts = ["-m", "not integration"]
