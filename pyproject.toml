[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-core"
version = "0.1.2"
description = "DocMesh FastAPI 기반 마이크로서비스 공통 SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "minio>=7.2.20",
    "nats-py>=2.14.0",
    "psycopg[binary]>=3.3.4",
    "pyjwt[crypto]>=2.12.1",
    "sqlalchemy>=2.0.49",
]

[tool.setuptools.packages.find]
include = ["fastapi_core*"]
exclude = ["test_fastapi_core*"]

[tool.setuptools.package-data]
fastapi_core = ["docs/*.md"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.pytest.ini_options]
testpaths = ["test_fastapi_core"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = ["integration: mark test as integration test (requires external services)"]
anyio_mode = "auto"
