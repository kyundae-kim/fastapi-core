[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-core"
version = "0.1.4"
description = "DocMesh FastAPI 기반 마이크로서비스 공통 SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docmesh-py-core>=0.1.4",
    "fastapi[standard]>=0.136.1",
    "langfuse>=4.7.1",
    "minio>=7.2.20",
    "nats-py>=2.14.0",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.4",
    "pyjwt[crypto]>=2.12.1",
    "pymilvus>=3.0.0",
    "sqlalchemy>=2.0.49",
]

[tool.setuptools.packages.find]
include = ["fastapi_core*"]
exclude = ["test_fastapi_core*"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.fastapi]
entrypoint = "fastapi_core.factory:create_app"

[tool.ruff]
line-length = 88
indent-width = 4

[tool.pytest.ini_options]
testpaths = ["test_fastapi_core"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = ["integration: mark test as integration test (requires external services)"]
anyio_mode = "auto"

[tool.uv.sources]
docmesh-py-core = { git = "https://github.com/kyundae-kim/docmesh-py-core.git" }
